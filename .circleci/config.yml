version: 2.1
setup: true
orbs:
  orb-tools: circleci/orb-tools@12.5
  shellcheck: circleci/shellcheck@3.4

filters: &filters
  tags:
    only: /.*/

jobs:
  test-env-subst:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: Run circleci env subst tests
          command: bash tests/env_subst_test.sh
  test-shell-conventions:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: Run shell conventions test
          command: bash tests/shell_conventions_test.sh
  test-docker-scripts:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: Run docker script tests
          command: bash tests/docker_scripts_test.sh
  test-actions:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: Check the GitHub Actions against the orb's commands
          command: bash tests/actions_test.sh
      - run:
          name: Run the command scripts without the CircleCI CLI, as the actions do
          command: bash tests/commands_test.sh

workflows:
  lint-pack:
    jobs:
      - test-env-subst:
          filters: *filters
      - test-shell-conventions:
          filters: *filters
      - test-docker-scripts:
          filters: *filters
      - test-actions:
          filters: *filters
      - orb-tools/lint:
          filters: *filters
      - orb-tools/pack:
          filters: *filters
      - orb-tools/review:
          orb_name: container-ops-orb
          filters: *filters
      - shellcheck/check:
          filters: *filters
      # Triggers the next workflow in the Orb Development Kit.
      - orb-tools/continue:
          pipeline_number: << pipeline.number >>
          vcs_type: << pipeline.project.type >>
          orb_name: container-ops-orb
          requires: [test-env-subst, test-shell-conventions, test-docker-scripts, test-actions, orb-tools/lint, orb-tools/pack, orb-tools/review, shellcheck/check]
          filters: *filters
