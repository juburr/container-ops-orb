description: |
  Build and publish a Docker image to a container registry.
  This example shows a basic build-publish workflow without signing or SBOM.
  The registry-credentials context provides REGISTRY_USERNAME and
  REGISTRY_PASSWORD, the default registry credential variables.

usage:
  version: "2.1"

  orbs:
    container-ops-orb: juburr/container-ops-orb@0.3.0

  workflows:
    build-publish:
      jobs:
        - container-ops-orb/build:
            image: myapp
        - container-ops-orb/publish:
            requires:
              - container-ops-orb/build
            image: myapp
            registry: ghcr.io
            registry_namespace: myorg
            context:
              - registry-credentials
