description: |
  Linux machine executor with Docker pre-installed, by default the
  ubuntu-2404:current machine image (Ubuntu 24.04 with a current Docker
  Engine) on the medium resource class. Docker runs natively on the VM, so
  jobs need no setup_remote_docker. This is the default executor of the
  build, publish and scan jobs.

parameters:
  image:
    type: string
    default: ubuntu-2404:current
    description: >
      CircleCI machine image. The jobs need a local Docker daemon, which
      CircleCI's Linux machine images include.
  resource_class:
    type: string
    default: medium
    description: CircleCI resource class, such as large or arm.medium.

machine:
  image: << parameters.image >>

resource_class: << parameters.resource_class >>
