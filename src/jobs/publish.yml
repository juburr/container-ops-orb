description: |
  Publish a container image to a registry with optional signing and SBOM generation.

  This job loads an archived image from a previous build job, tags it for the
  target registry, pushes it, and optionally:
  - Signs the image with Cosign (key-based)
  - Generates an SBOM with Syft
  - Attests the SBOM to the image

  Designed to work with the build job in a build-once, publish-many workflow.

  Signing, SBOM generation and attestation use the digest this job pushed,
  exported as PUBLISHED_IMAGE_DIGEST_REF (registry/namespace/image@sha256:...),
  so they never depend on where a tag points in the registry. Publishing is
  single-platform: multi-platform images are not supported. See the README
  for details.

executor: << parameters.executor >>

parameters:
  # === EXECUTOR CONFIGURATION ===
  executor:
    type: executor
    default: machine
    description: |
      The executor to use for the publish job. Defaults to this orb's machine
      executor, a Linux VM with Docker pre-installed. A machine executor is
      recommended as it provides native Docker support without requiring
      setup_remote_docker.
      To change its image or resource class, pass them to it, for example
      executor: {name: container-ops-orb/machine, resource_class: large}.

  # === IMAGE CONFIGURATION ===
  image:
    type: string
    description: |
      (Required) The local image name (repository, without a tag) from the
      build job. This should match the image name used when building and
      saving; it selects the archive <image>-img.tar. Example: "myapp"

  tag:
    type: string
    default: "${CIRCLE_SHA1}"
    description: |
      The source tag: the job retags the loaded image <image>:<tag> for the
      registry, and finds the digest it pushed through that image. It must
      be the tag the build job saved, its first tag (by default the commit
      SHA). It is not used for loading: docker_load reads <image>-img.tar,
      which restores the tag saved in it. Without tags_file, the image is
      pushed as this tag plus additional_tags; with tags_file, as the tags
      in that file only. Supports environment variable substitution.

  additional_tags:
    type: string
    default: ""
    description: |
      Additional tags to apply when pushing (space-separated).
      These tags are applied in addition to the primary tag.
      Example: "latest v1.0.0"

  # === REGISTRY CONFIGURATION ===
  registry:
    type: string
    description: |
      (Required) Container registry hostname to push to.
      Examples: "ghcr.io", "docker.io", "gcr.io", "123456789.dkr.ecr.us-east-1.amazonaws.com"

  registry_namespace:
    type: string
    description: |
      (Required) Registry namespace or organization path.
      Combined with registry and image name to form the full image path.
      Example: "myorg" results in "ghcr.io/myorg/myapp"

  registry_username:
    type: env_var_name
    default: REGISTRY_USERNAME
    description: |
      Name of the environment variable containing the registry username.

  registry_password:
    type: env_var_name
    default: REGISTRY_PASSWORD
    description: |
      Name of the environment variable containing the registry password
      or access token.

  # === WORKSPACE CONFIGURATION ===
  attach_workspace:
    type: boolean
    default: true
    description: |
      Attach a workspace from a previous job to access the archived image.
      Set to false when the archive reaches archive_dir another way, for
      example from a before_publish step: the job always loads the image
      from archive_dir.

  attach_workspace_at:
    type: string
    default: "~"
    description: |
      Path where the workspace should be attached.

  archive_dir:
    type: string
    default: "~/images"
    description: |
      Directory that holds the image archive (<image>-img.tar). The build
      job persists its archive_dir as "images" under its workspace_root, so
      with the workspace attached at attach_workspace_at the archive is in
      <attach_workspace_at>/images; the defaults of both jobs agree.

  # === TAG FILE SUPPORT (tagger orb integration) ===
  tags_file:
    type: string
    default: ""
    description: |
      Path to a tags file generated by the container-tagger-orb.
      When set, the tagger orb commands are used instead of docker_tag/docker_push.
      Each line in the file should contain one tag.
      Example: "~/workspace/tags.txt"

  # === TOOL INSTALLATION ===
  verify_checksums:
    type: enum
    enum: ["false", "known_versions", "strict"]
    default: "strict"
    description: |
      SHA-512 checksum verification for the Cosign and Syft downloads.
      Passed to cosign/install and syft/install.
      - strict: fail unless the version's checksum is known to the installing
        orb and matches (recommended)
      - known_versions: verify known versions, but install unknown versions
        without verification
      - false: never verify (not recommended)
      With strict, setting cosign_version or syft_version to a release the
      installing orb has no checksum for fails the job.

  # === SIGNING CONFIGURATION ===
  sign:
    type: boolean
    default: false
    description: |
      Enable image signing with Cosign using key-based signing.
      Requires cosign_private_key and cosign_password to be set.

  cosign_version:
    type: string
    default: "3.1.3"
    description: |
      Version of Cosign to install for signing operations.

  cosign_bundle_format:
    type: enum
    enum: ["auto", "bundle", "legacy"]
    default: "auto"
    description: |
      How signatures and attestations are stored in the registry, passed to
      the cosign orb's sign, verify, attest and verify_attestation commands.
      - auto: Cosign's own default: Sigstore bundles stored as OCI referrers
        for Cosign 3, legacy for Cosign 1 and 2
      - bundle: Sigstore bundles (Cosign 2.6.0 or later)
      - legacy: sha256-<hex>.sig and .att tags next to the image, which
        verifiers on older Cosign versions read

  cosign_private_key:
    type: env_var_name
    default: COSIGN_PRIVATE_KEY
    description: |
      Name of the environment variable containing the base64-encoded
      Cosign private key for signing.

  cosign_password:
    type: env_var_name
    default: COSIGN_PASSWORD
    description: |
      Name of the environment variable containing the password
      for the Cosign private key.

  cosign_public_key:
    type: env_var_name
    default: COSIGN_PUBLIC_KEY
    description: |
      Name of the environment variable containing the base64-encoded
      Cosign public key for signature verification.

  verify_signature:
    type: boolean
    default: true
    description: |
      Verify the signature after signing. Requires cosign_public_key to be set.
      Only applies when sign is true.

  # === SBOM CONFIGURATION ===
  sbom:
    type: boolean
    default: false
    description: |
      Enable SBOM (Software Bill of Materials) generation with Syft.

  sbom_format:
    type: enum
    enum: ["spdx-json", "cyclonedx-json"]
    default: "spdx-json"
    description: |
      Output format for the generated SBOM, in the spec version Syft writes
      by default.
      - spdx-json: SPDX JSON
      - cyclonedx-json: CycloneDX JSON

  syft_version:
    type: string
    default: "1.52.0"
    description: |
      Version of Syft to install for SBOM generation.

  log_sbom:
    type: boolean
    default: false
    description: |
      Output the generated SBOM to the job logs.

  # === ATTESTATION CONFIGURATION ===
  attest:
    type: boolean
    default: false
    description: |
      Attest the SBOM to the image using Cosign.
      Requires both sign=true and sbom=true to be enabled.

  verify_attestation:
    type: boolean
    default: true
    description: |
      Verify the attestation after attesting. Requires cosign_public_key to be set.
      Only applies when attest is true.

  # === WORKFLOW CUSTOMIZATION ===
  before_publish:
    type: steps
    default: []
    description: |
      Steps to run after the optional workspace attach, and before registry
      login and loading the image. This job does not check out code.
      CircleCI's built-in pre-steps, by contrast, run before the workspace
      attach, as the job's very first steps.

  after_publish:
    type: steps
    default: []
    description: |
      Steps to run after the push and the optional signing, SBOM and
      attestation steps, and before registry logout, so they can still use
      the registry login. CircleCI's built-in post-steps, by contrast, run
      after registry logout, as the job's very last steps.

steps:
  # 1. Workspace attachment (conditional)
  - when:
      condition: << parameters.attach_workspace >>
      steps:
        - attach_workspace:
            at: << parameters.attach_workspace_at >>

  # 2. Before-publish hook (user customization)
  - steps: << parameters.before_publish >>

  # 3. Registry login
  - docker_login:
      registry: << parameters.registry >>
      username: << parameters.registry_username >>
      password: << parameters.registry_password >>

  # 4. Load archived image
  - docker_load:
      image: << parameters.image >>
      archive_dir: << parameters.archive_dir >>

  # 5a. Tag and push using tagger orb (when tags_file is provided)
  - when:
      condition: << parameters.tags_file >>
      steps:
        - tagger/tag:
            source_image: << parameters.image >>:<< parameters.tag >>
            target_image: << parameters.registry >>/<< parameters.registry_namespace >>/<< parameters.image >>
            tags_file: << parameters.tags_file >>
        - tagger/push:
            target_image: << parameters.registry >>/<< parameters.registry_namespace >>/<< parameters.image >>
            tags_file: << parameters.tags_file >>
        - tagger/export_tag

  # 5b. Tag and push using docker commands (when tags_file is not provided)
  - unless:
      condition: << parameters.tags_file >>
      steps:
        - docker_tag:
            source_image: << parameters.image >>:<< parameters.tag >>
            target_image: << parameters.registry >>/<< parameters.registry_namespace >>/<< parameters.image >>
            tags: << parameters.tag >> << parameters.additional_tags >>
        - docker_push:
            image: << parameters.registry >>/<< parameters.registry_namespace >>/<< parameters.image >>
            tags: << parameters.tag >> << parameters.additional_tags >>

  # 6. Find the digest the push stored, for the steps below and after_publish
  - run:
      name: Resolve Pushed Digest
      environment:
        PARAM_SOURCE_IMAGE: << parameters.image >>:<< parameters.tag >>
        PARAM_REPOSITORY: << parameters.registry >>/<< parameters.registry_namespace >>/<< parameters.image >>
      command: << include(scripts/docker/resolve_digest.sh) >>

  # 7. Signing with Cosign (conditional)
  - when:
      condition: << parameters.sign >>
      steps:
        # 7a. Install Cosign
        - cosign/install:
            version: << parameters.cosign_version >>
            caching: true
            verify_checksums: << parameters.verify_checksums >>
        # 7b. Sign image
        - cosign/sign:
            image: ${PUBLISHED_IMAGE_DIGEST_REF}
            private_key: << parameters.cosign_private_key >>
            password: << parameters.cosign_password >>
            bundle_format: << parameters.cosign_bundle_format >>
        # 7c. Verify signature (conditional)
        - when:
            condition: << parameters.verify_signature >>
            steps:
              - cosign/verify:
                  image: ${PUBLISHED_IMAGE_DIGEST_REF}
                  public_key: << parameters.cosign_public_key >>
                  bundle_format: << parameters.cosign_bundle_format >>

  # 8. SBOM generation with Syft (conditional)
  - when:
      condition: << parameters.sbom >>
      steps:
        # 8a. Install Syft
        - syft/install:
            version: << parameters.syft_version >>
            caching: true
            verify_checksums: << parameters.verify_checksums >>
        # 8b. Generate SBOM
        - syft/generate_sbom:
            source: ${PUBLISHED_IMAGE_DIGEST_REF}
            output_formats: << parameters.sbom_format >>
            output_dir: sboms
        # 8c. Log SBOM (conditional)
        - when:
            condition: << parameters.log_sbom >>
            steps:
              - run:
                  name: Display SBOM
                  command: |
                    echo "Generated SBOM:"
                    cat sboms/*

  # 9. SBOM attestation (conditional - requires sign=true and sbom=true)
  - when:
      condition:
        and:
          - << parameters.attest >>
          - << parameters.sign >>
          - << parameters.sbom >>
      steps:
        # 9a. Prepare attestation (determine SBOM path and type)
        - run:
            name: Prepare SBOM Attestation
            environment:
              PARAM_IMAGE: ${PUBLISHED_IMAGE_DIGEST_REF}
              PARAM_SBOM_FORMAT: << parameters.sbom_format >>
            command: << include(scripts/docker/prepare_attestation.sh) >>
        - cosign/attest:
            image: ${PUBLISHED_IMAGE_DIGEST_REF}
            predicate: ${SBOM_FILE}
            predicate_type: ${PREDICATE_TYPE}
            private_key: << parameters.cosign_private_key >>
            password: << parameters.cosign_password >>
            bundle_format: << parameters.cosign_bundle_format >>
        # 9b. Verify attestation (conditional)
        - when:
            condition: << parameters.verify_attestation >>
            steps:
              - cosign/verify_attestation:
                  image: ${PUBLISHED_IMAGE_DIGEST_REF}
                  predicate_type: ${PREDICATE_TYPE}
                  public_key: << parameters.cosign_public_key >>
                  bundle_format: << parameters.cosign_bundle_format >>

  # 10. After-publish hook (user customization)
  - steps: << parameters.after_publish >>

  # 11. Registry logout
  - docker_logout:
      registry: << parameters.registry >>
