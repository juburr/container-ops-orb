description: |
  Build a Docker container image with comprehensive options for:
  - Multi-stage Dockerfile support
  - OCI-compliant label injection
  - Base image pre-pulling (for local-only images like those from apko/melange)
  - Cross-platform builds for a single target platform with buildx
  - Docker layer caching
  - Workspace persistence for downstream jobs (publish, scan)

  This job is designed to work with the publish job to enable
  a build-once, publish-many workflow pattern.

executor: << parameters.executor >>

parameters:
  # === EXECUTOR CONFIGURATION ===
  executor:
    type: executor
    default: machine
    description: |
      The executor to use for the build job. Defaults to this orb's machine
      executor, a Linux VM with Docker pre-installed. A machine executor is
      recommended as it provides native Docker support without requiring
      setup_remote_docker.

  # === IMAGE CONFIGURATION ===
  image:
    type: string
    description: |
      (Required) The image name (repository) to build, without a tag. Each
      of tags is applied as <image>:<tag>, and the archive is named after it.
      Example: "myapp" or "myorg/myapp"

  tags:
    type: string
    default: "${CIRCLE_SHA1}"
    description: |
      Space-separated list of tags to apply to the built image.
      Supports environment variable substitution.
      Example: "latest v1.0.0 ${CIRCLE_SHA1}"

  # === BUILD CONFIGURATION ===
  dockerfile:
    type: string
    default: "Dockerfile"
    description: |
      Path to the Dockerfile, passed to docker build -f. A relative path is
      resolved against the working directory (the checkout), as Docker does,
      not against build_context. The default is ./Dockerfile in the working
      directory; for a Dockerfile inside another build context, include that
      directory, e.g. build_context "app" with dockerfile "app/Dockerfile".

  build_context:
    type: string
    default: "."
    description: |
      Build context directory, the last argument of docker build: the root
      directory sent to the Docker daemon for the build. An absolute path or
      a path relative to the working directory, which is the default.

  target:
    type: string
    default: ""
    description: |
      Target build stage for multi-stage Dockerfiles. Leave empty to build
      the final stage. Example: "prod" or "builder"

  build_args:
    type: string
    default: ""
    description: |
      Additional build arguments as KEY=VALUE pairs separated by whitespace
      (spaces or newlines). Each pair is passed as its own --build-arg, so a
      value cannot contain whitespace; pass such a value through extra_args.
      Example: "ARG1=value1 ARG2=value2"
      Note: OCI label build args are automatically injected (see oci_labels).

  extra_args:
    type: string
    default: ""
    description: |
      Additional arguments appended to the docker build (or docker buildx
      build) command, before the build context. Split like shell words, so
      quotes keep a value with spaces together. Environment variables such
      as ${CIRCLE_SHA1} are substituted, but nothing else is expanded or
      executed: $(...), backticks, ~ and wildcards reach docker as written.
      Example: "--no-cache --progress=plain"

  no_output_timeout:
    type: string
    default: "20m"
    description: |
      Maximum time the build step can run without producing output
      before being killed. Increase for large builds.

  # === OCI LABELS ===
  oci_labels:
    type: boolean
    default: true
    description: |
      Automatically inject OCI-compliant label values as build arguments.
      When enabled, the following build args are passed:
        - OCI_CREATED: Build timestamp (RFC 3339)
        - OCI_REVISION: Git commit SHA (CIRCLE_SHA1)
        - OCI_VERSION: image_version, else CIRCLE_TAG, else "dev"
        - OCI_SOURCE: Source repository URL (CIRCLE_REPOSITORY_URL)
      Your Dockerfile should use ARG and LABEL to consume these values.

  image_version:
    type: string
    default: ""
    description: |
      Value of the OCI_VERSION build argument, for a Dockerfile to use in the
      org.opencontainers.image.version label. It only sets that build
      argument: it does not tag the image, and it is ignored when oci_labels
      is false. If empty, CIRCLE_TAG is used if set, otherwise "dev".

  # === BASE IMAGE HANDLING ===
  pull_base_images:
    type: string
    default: ""
    description: |
      Base images to pull before building, separated by whitespace (spaces
      or newlines), with the docker_pull command. A failed pull is only a
      warning. Use this instead of pull when some base images exist only
      locally (e.g., built with apko/melange), because Docker's --pull flag
      fails for local-only images; list only the registry images here.
      Example: "ghcr.io/myorg/base:latest myregistry/runtime:1.0"

  pull:
    type: boolean
    default: false
    description: |
      Pass --pull to docker build, so that it always pulls the base images
      from the registry instead of using local copies. Note: This fails if
      any base image only exists locally. Use pull_base_images for mixed
      scenarios.

  # === TARGET PLATFORM ===
  platform:
    type: string
    default: ""
    description: |
      A single target platform for a cross-platform build with Docker
      buildx. Example: "linux/arm64"
      The build runs docker buildx build --platform <platform> --load, which
      loads the image into the local Docker image store. With Docker's
      classic image store --load holds one platform, so a list such as
      "linux/amd64,linux/arm64" is not supported; neither are multi-platform
      images (see the README).
      Leave empty to build for the runner's platform with docker build.

  buildx_builder:
    type: string
    default: ""
    description: |
      Name of the buildx builder instance to use. If empty, the default
      builder is used. Only applies when platform is specified.

  # === REGISTRY AUTHENTICATION ===
  registry:
    type: string
    default: ""
    description: |
      Container registry to authenticate with for pulling private base
      images. Leave empty to skip registry login. Examples: "ghcr.io",
      "docker.io", "gcr.io", "123456789.dkr.ecr.us-east-1.amazonaws.com"

  registry_username:
    type: env_var_name
    default: REGISTRY_USERNAME
    description: |
      Name of the environment variable containing the registry username.
      Only used when registry is specified.

  registry_password:
    type: env_var_name
    default: REGISTRY_PASSWORD
    description: |
      Name of the environment variable containing the registry password
      or access token. Only used when registry is specified.

  # === OUTPUT CONFIGURATION ===
  archive:
    type: boolean
    default: true
    description: |
      Save the built image (<image>:<first tag>) with docker save to the tar
      archive <archive_dir>/<image>-img.tar, with each / in image replaced
      by -, for workspace persistence.

  archive_dir:
    type: string
    default: "~/images"
    description: |
      Directory where the image archive is saved. An absolute path, a path
      starting with ~, or a path relative to the working directory.
      When persist_to_workspace is true, it must be <workspace_root>/images
      (the default with the default workspace_root), or the job fails.

  persist_to_workspace:
    type: boolean
    default: true
    description: |
      Persist the archive to the CircleCI workspace for use in subsequent
      jobs. Only applies when archive is true. This persists the directory
      "images" under workspace_root, so archive_dir must be
      <workspace_root>/images; the job fails otherwise.

  workspace_root:
    type: string
    default: "~"
    description: |
      Root directory of the persisted workspace (persist_to_workspace's
      root). The workspace receives the "images" directory under this root,
      which must be archive_dir. A downstream job that attaches the
      workspace at <path> finds the archive in <path>/images.

  # === INSPECTION & DEBUGGING ===
  inspect:
    type: boolean
    default: true
    description: |
      Run docker inspect on the built image and display the output.
      Useful for verifying labels and image configuration.

  # === WORKFLOW CUSTOMIZATION ===
  attach_workspace:
    type: boolean
    default: false
    description: |
      Attach a workspace from a previous job before building.
      Useful when base images or build artifacts are in the workspace.

  attach_workspace_at:
    type: string
    default: "."
    description: |
      Path where the workspace should be attached.

  before_build:
    type: steps
    default: []
    description: |
      Steps to run after checkout and the optional workspace attach, and
      before registry login, base image pulls and the build. CircleCI's
      built-in pre-steps, by contrast, run before checkout, as the job's
      very first steps.

  after_build:
    type: steps
    default: []
    description: |
      Steps to run after the build, inspect, archive and workspace persist
      steps, and before registry logout, so they can still use the registry
      login. Files they create are not in the workspace this job persists.
      CircleCI's built-in post-steps, by contrast, run after registry
      logout, as the job's very last steps.

steps:
  # 1. Source code checkout
  - checkout

  # 2. Workspace attachment (conditional)
  - when:
      condition: << parameters.attach_workspace >>
      steps:
        - attach_workspace:
            at: << parameters.attach_workspace_at >>

  # 3. Before-build hook (user customization)
  - steps: << parameters.before_build >>

  # 4. Registry login (conditional - for private base images)
  - when:
      condition: << parameters.registry >>
      steps:
        - docker_login:
            registry: << parameters.registry >>
            username: << parameters.registry_username >>
            password: << parameters.registry_password >>

  # 5. Pull base images (conditional - workaround for local-only images)
  - when:
      condition: << parameters.pull_base_images >>
      steps:
        - docker_pull:
            images: << parameters.pull_base_images >>

  # 6. Core build step
  - docker_build:
      image: << parameters.image >>
      tags: << parameters.tags >>
      dockerfile: << parameters.dockerfile >>
      build_context: << parameters.build_context >>
      target: << parameters.target >>
      build_args: << parameters.build_args >>
      extra_args: << parameters.extra_args >>
      oci_labels: << parameters.oci_labels >>
      image_version: << parameters.image_version >>
      pull: << parameters.pull >>
      platform: << parameters.platform >>
      buildx_builder: << parameters.buildx_builder >>
      no_output_timeout: << parameters.no_output_timeout >>

  # 7. Image inspection (conditional)
  - when:
      condition: << parameters.inspect >>
      steps:
        - docker_inspect:
            image: << parameters.image >>

  # 8. Archive image (conditional)
  - when:
      condition: << parameters.archive >>
      steps:
        - docker_save:
            image: << parameters.image >>
            archive_dir: << parameters.archive_dir >>
            persist_to_workspace: << parameters.persist_to_workspace >>
            workspace_root: << parameters.workspace_root >>

  # 9. After-build hook (user customization)
  - steps: << parameters.after_build >>

  # 10. Registry logout (conditional)
  - when:
      condition: << parameters.registry >>
      steps:
        - docker_logout:
            registry: << parameters.registry >>
