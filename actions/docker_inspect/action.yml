name: Inspect a Docker image
description: >
  Prints a local image's metadata: its ID, creation time, size, platform,
  labels, environment variables, exposed ports, entrypoint and command, and
  the start of docker image inspect's JSON. Useful for checking labels after
  a build. The GitHub Actions twin of the orb's docker_inspect command.
author: juburr

inputs:
  image:
    description: The image name to inspect, without a tag, such as myapp or myorg/myapp.
    required: true
  tag:
    description: >
      The tag of the image to inspect. If empty, the BUILT_IMAGE_TAG
      environment variable the docker_build action sets is used, or latest
      when that isn't set.
    default: ""

runs:
  using: composite
  steps:
    - name: Docker Inspect
      shell: bash
      env:
        PARAM_IMAGE: ${{ inputs.image }}
        PARAM_TAG: ${{ inputs.tag }}
      run: bash "${GITHUB_ACTION_PATH}/../run_script.sh" "${GITHUB_ACTION_PATH}/../../src/scripts/docker/inspect.sh"
